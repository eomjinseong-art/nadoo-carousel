name: Sync Google Sheets

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download sheets into data JSON
        run: node scripts/sync-sheets.mjs
      - name: Commit only when the JSON changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carousel-visibility.json data/products.json
          if git diff --cached --quiet; then
            echo "No sheet changes."
          else
            git commit -m "chore: sync carousel visibility and desk products from sheets"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push
          fi
